services:
  db:
    image: postgres:16-alpine
    container_name: pitchometro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pitchometro
      POSTGRES_USER: pitchometro
      POSTGRES_PASSWORD: pitchometro
    volumes:
      - pitchometro_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pitchometro-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://pitchometro:pitchometro@db:5432/pitchometro
      DATABASE_URL_UNPOOLED: postgresql://pitchometro:pitchometro@db:5432/pitchometro
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  pitchometro_pgdata:
